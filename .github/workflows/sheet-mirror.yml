# Sheet mirror for the rebuild (see .github/sheets_pull.py). Pulls the runbook's Step 2 ranges with a service account and force-pushes
# one commit to the orphan branch `sheet-mirror` (in/*.json + games.csv). Does nothing until the SHEETS_SA_JSON secret exists.
name: sheet-mirror
on:
  schedule: [{cron: "5,35 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: sheet-mirror, cancel-in-progress: true}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      # owner 11/19: official rule-outs (ESPN team report: IR, or Out with "ruled out" wording) are written to 'AUTO - Weekly Availability'
      # here, before the pull, so the mirror below already holds the recalculated projections. Narrow by design - see the file's header.
      # It reports in out/in/AVAIL_AUTO.json and can never fail this job. Remove this step to turn it off.
      - run: python3 .github/avail_auto.py
        env: {SHEETS_SA_JSON: "${{ secrets.SHEETS_SA_JSON }}"}
      - run: python3 .github/sheets_pull.py
        env: {SHEETS_SA_JSON: "${{ secrets.SHEETS_SA_JSON }}"}
      # owner 11/25: FanDuel prices readers typed into the builder, for the weekly fit of its same-game discount (.github/fd_quotes.py).
      # Reads the database with the cron secret the grading job uses; never fails this job, prints no secret and no row.
      - run: python3 .github/fd_quotes.py
        env: {FEED_GRADE_SECRET: "${{ secrets.FEED_GRADE_SECRET }}"}
      - run: |
          test -f out/in/MIRROR.json || { echo "no mirror written (secret missing?)"; exit 0; }
          cd out
          git init -q -b sheet-mirror && git config user.name BetSweep && git config user.email support@betsweep.co
          git add -A && git commit -qm "Sheet mirror $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.ENGINE_TOKEN || github.token }}@github.com/${{ vars.ENGINE_REPO || github.repository }}.git" sheet-mirror
