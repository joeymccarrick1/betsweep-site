# Temporary diagnostic: probe ESPN endpoints from a GitHub runner (the build sandbox cannot reach ESPN). Safe to delete.
name: probe
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://site.api.espn.com/apis/site/v2/sports/football/nfl
          curl -fsS "$S/scoreboard" -o sb.json
          python3 - <<'PY'
          import json,subprocess,re
          sb=json.load(open('sb.json'))
          for ev in sb['events']:
              c=ev['competitions'][0]; t=[x['team']['abbreviation'] for x in c['competitors']]
              print(ev['id'], t, ev['status']['type']['state'], ev['date'])
          ev=[e for e in sb['events'] if 'PHI' in [x['team']['abbreviation'] for x in e['competitions'][0]['competitors']]][0]
          eid=ev['id']; c=ev['competitions'][0]
          s=json.loads(subprocess.check_output(['curl','-fsS',f'https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event={eid}']))
          print('summary keys',list(s.keys()))
          def walk(o,p=''):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if re.search(r'inactiv|active|didNotPlay|dnp',k,re.I): print('KEY',p+'/'+k, str(v)[:150])
                      walk(v,p+'/'+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o[:3]): walk(v,p+f'[{i}]')
          walk(s)
          if 'injuries' in s: print('injuries sample', json.dumps(s['injuries'])[:1500])
          for comp in c['competitors']:
              tid=comp['team']['id']
              for u in [f'https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/{eid}/competitions/{eid}/competitors/{tid}/roster',
                        f'https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/summary?event={eid}']:
                  try:
                      r=json.loads(subprocess.check_output(['curl','-fsS',u])); print('URL',u,'keys',list(r.keys())[:15])
                      ents=r.get('entries') or []
                      print(' entries',len(ents), json.dumps(ents[0])[:600] if ents else '')
                      inact=[e for e in ents if e.get('didNotPlay') or e.get('active') is False]
                      print(' inactive-ish', len(inact), [ (e.get('displayName') or e.get('athlete',{}).get('$ref','')[-30:], e.get('didNotPlay'), e.get('active'), e.get('reason')) for e in inact[:12]])
                  except Exception as x: print('ERR',u,x)
          PY
