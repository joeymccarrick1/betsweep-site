# Social grading (alpha plan step 2, 11/16). Grades finished Social posts for the record on every post and profile.
# Runs social_grade.py from gen-overrides: reads open, ungraded posts with the site's public key, grades each from the nflverse finals
# (weekly player stats, final scores, snap counts) and records the result through the database's feed_grade().
#   certain or nothing .. lost = one leg missed, won = every leg hit, push = every leg pushed. Anything else is left and reported.
#   the secret .......... it writes only when the repo secret FEED_GRADE_SECRET holds the value the owner put in the database
#                         (his copy of sql/social_v3.sql). Without it every run is a dry run. The value is never printed.
#   Run workflow ........ grade (default), dry (read and report, write nothing), detail (dry, plus every leg with its numbers - legs only,
#                         no usernames) or probe (what the database has: counts only)
# It never touches the site's files or the Google Sheet. Turn it off: Actions > social-grade > "..." > Disable workflow.
name: social-grade
on:
  schedule:
    - cron: "40 15 * * *"      # every morning, 9:40 AM Central: last night's games are in the nflverse files by then
  workflow_dispatch:
    inputs:
      mode:
        description: "grade = record results (needs FEED_GRADE_SECRET); dry = read and report only; detail = dry, with every leg and its numbers; probe = what the database has; check = does the database accept the secret (writes nothing)"
        type: choice
        default: grade
        options: [grade, dry, detail, probe, check]
permissions: {contents: read}
concurrency: {group: social-grade, cancel-in-progress: false}
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {repository: "${{ vars.ENGINE_REPO || github.repository }}", token: "${{ secrets.ENGINE_TOKEN || github.token }}", ref: gen-overrides, path: gen}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Grade
        shell: bash
        env:
          FEED_GRADE_SECRET: ${{ secrets.FEED_GRADE_SECRET }}
          MODE: ${{ inputs.mode || 'grade' }}
        run: |
          cd gen; mkdir -p in
          if [ "$MODE" = "probe" ]; then python3 social_grade.py --probe | tee ../grade.log; exit 0; fi
          if [ "$MODE" = "check" ]; then python3 social_grade.py --check | tee ../grade.log; exit 0; fi
          if [ "$MODE" = "grade" ] && [ -n "$FEED_GRADE_SECRET" ]; then W=--write; else W=; echo "dry run (mode $MODE, secret $([ -n "$FEED_GRADE_SECRET" ] && echo set || echo not set))"; fi
          if [ "$MODE" = "detail" ]; then W=--detail; fi
          python3 social_grade.py --fetch $W | tee ../grade.log
      - name: Where the secret is (yes / no only - no value is ever printed)
        if: always() && inputs.mode == 'check'
        run: |
          echo "Actions secret named FEED_GRADE_SECRET: ${{ secrets.FEED_GRADE_SECRET != '' }}"
          echo "Actions VARIABLE named FEED_GRADE_SECRET (wrong tab - variables are not hidden): ${{ vars.FEED_GRADE_SECRET != '' }}"
          # (11/16: a line here once tested an older secret to prove the check can see secrets - it could, and naming a JSON secret in a job makes GitHub hide every brace in that job's log, so it is gone)
          echo "Actions secret named CRON_SECRET: ${{ secrets.CRON_SECRET != '' }}"
          echo "Actions secret named FEED_GRADE: ${{ secrets.FEED_GRADE != '' }}"
          echo "Actions secret named GRADE_SECRET: ${{ secrets.GRADE_SECRET != '' }}"
      - name: Summary
        if: always()
        run: |
          { echo '### social-grade'; echo '```'; tail -40 grade.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
